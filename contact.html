<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
</head>
<body>
    <header>
        <a href="index.html" aria-label="Kritarth Home">Kritarth</a>

     <nav aria-label="Primary navigation">
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="contact.html">CONTACT</a></li>
        </ul>
     </nav>
    </header>

    <main>
        <section>
            <div>
                <h1>Contact Me</h1>
             <form action="#" method="post" aria-label="contact form">
                <div>
                    <label for="name">
                        FULL NAME
                        <span aria-hidden="true">*</span>
                    </label>
                    <input type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                    aria-required="true">
                </div>

                <div>

                 <label for="email">
                    Email Address
                    <span aria-hidden="true">*</span>
                 </label>

                 <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                    aria-required="true">

                </div>

                <div>

                <label for="subject">
                    Subject
                    <span aria-hidden="true">*</span>
                </label>

                <input
                    id="subject"
                    name="subject"
                    type="text">

            </div>
                 <br>
                <div>

                 <label for="message">
                    Message
                    <span aria-hidden="true">*</span>
                 </label>

                 <textarea
                    id="message"
                    name="message"
                    required
                    aria-required="true">
                </textarea>

                </div>
                
                <button class="button" type="submit">
                Send Message
                </button>

             </form>   
            </div>
        </section>
    </main>

    <footer>
        <div>
        <p>
            &copy;2026 Kritarth. All right reserved.
        </p>
        </div>
        </footer>
</body>
</html>
